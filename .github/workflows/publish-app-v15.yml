name: Publish App V15

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply full width map layout
        run: printf '\n.dashboard-grid{grid-template-columns:1fr!important;}\n.dashboard-card,.map-card{width:100%%;}\n.map-card{min-height:auto!important;}\n.map-area{width:100%%;min-height:560px!important;overflow:visible;}\n.map-node{white-space:nowrap;}\n@media(max-width:520px){.map-area{min-height:460px!important}.map-node{min-width:58px;font-size:.72rem;padding:8px 9px}}\n' >> src/styles.css
      - run: ./node_modules/.bin/vite build --base=/black-hole-time-app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
