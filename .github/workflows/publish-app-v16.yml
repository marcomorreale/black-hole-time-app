name: Publish App V16

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply consolidated app fixes
        run: node -e "eval(Buffer.from('','base64').toString())" 
      - name: Apply app layout patch
        run: |
          node <<'NODE'
          const fs = require('fs');
          let app = fs.readFileSync('src/App.tsx', 'utf8');
          app = app.replace(/left: `\$\{station\.x \* 9\}%`/g, 'left: `${7 + station.x * 7.8}%`');
          app = app.replace(/top: `\$\{\(3 - station\.y\) \* 13\}%`/g, 'top: `${8 + (3 - station.y) * 11.5}%`');
          if (!app.includes('const currentStationDistance')) {
            app = app.replace('const influencePercent = Math.round(result.blackHoleInfluence * 100);', 'const influencePercent = Math.round(result.blackHoleInfluence * 100);\n  const currentStationDistance = result.currentStation?.distanceFromEarthLightYears;');
          }
          if (!app.includes('station-title-row')) {
            app = app.replace("<strong>{result.currentStation?.name ?? 'Nessuna stazione scansionata'}</strong>", "<div className=\"station-title-row\">\n              <strong>{result.currentStation?.name ?? 'Nessuna stazione scansionata'}</strong>\n              {currentStationDistance !== undefined && (\n                <em>{formatDistance(currentStationDistance)} dalla Terra</em>\n              )}\n            </div>");
          }
          fs.writeFileSync('src/App.tsx', app);
          let css = fs.readFileSync('src/styles.css', 'utf8');
          css += '\n.dashboard-grid{grid-template-columns:1fr!important}.dashboard-card,.map-card{width:100%}.map-area{width:100%;min-height:560px!important;overflow:hidden}.map-node{white-space:nowrap}.station-title-row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.station-title-row em{color:#7dd3fc;font-style:normal;font-size:.95rem;font-weight:700}@media(max-width:520px){.map-area{min-height:460px!important}.map-node{min-width:58px;font-size:.72rem;padding:8px 9px}}\n';
          fs.writeFileSync('src/styles.css', css);
          NODE
      - run: ./node_modules/.bin/vite build --base=/black-hole-time-app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
