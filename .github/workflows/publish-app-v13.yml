name: Publish App V13

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply full width map layout
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cssPath = 'src/styles.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          css += `

/* V13: full width map layout */
.dashboard-grid {
  grid-template-columns: 1fr !important;
}

.dashboard-card,
.map-card {
  width: 100%;
}

.map-card {
  min-height: auto !important;
}

.map-area {
  width: 100%;
  min-height: 520px !important;
  overflow: visible;
}

.map-node {
  white-space: nowrap;
}

@media (min-width: 980px) {
  .map-area {
    min-height: 560px !important;
  }
}

@media (max-width: 520px) {
  .map-area {
    min-height: 460px !important;
  }

  .map-node {
    min-width: 58px;
    font-size: 0.72rem;
    padding: 8px 9px;
  }
}
`;
          fs.writeFileSync(cssPath, css);

          const finalTitle = 'Il tempo e il buco nero';
          const appPath = 'src/App.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app
            .replace(/Chi torna piu giovane\?/g, finalTitle)
            .replace(/Chi torna più giovane\?/g, finalTitle)
            .replace(/Il buco nero e il tempo/g, finalTitle)
            .replace(/Il tempo e il buco nero/g, finalTitle);
          fs.writeFileSync(appPath, app);

          const htmlPath = 'index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');
          html = html
            .replace(/Chi torna piu giovane\?/g, finalTitle)
            .replace(/Chi torna più giovane\?/g, finalTitle)
            .replace(/Il buco nero e il tempo/g, finalTitle)
            .replace(/Il tempo e il buco nero/g, finalTitle);
          fs.writeFileSync(htmlPath, html);
          NODE
      - run: ./node_modules/.bin/vite build --base=/black-hole-time-app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
