name: Publish App V3

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply black hole station distances and app title
        run: |
          node <<'NODE'
          const fs = require('fs');

          const stationsPath = 'src/data/stations.ts';
          let stations = fs.readFileSync(stationsPath, 'utf8');
          stations = stations.replace(
            "x: 7,\n    y: 1,\n    schwarzschildDistance: 10,",
            "x: 7,\n    y: 1,\n    distanceFromEarthLightYears: 4.0,\n    schwarzschildDistance: 10,"
          );
          stations = stations.replace(
            "x: 8,\n    y: 0,\n    schwarzschildDistance: 2,",
            "x: 8,\n    y: 0,\n    distanceFromEarthLightYears: 4.2,\n    schwarzschildDistance: 2,"
          );
          stations = stations.replace(
            "x: 9,\n    y: -1,\n    schwarzschildDistance: 1.5,",
            "x: 9,\n    y: -1,\n    distanceFromEarthLightYears: 4.25,\n    schwarzschildDistance: 1.5,"
          );
          stations = stations.replace(
            "x: 9.5,\n    y: -1.5,\n    schwarzschildDistance: 1.2,",
            "x: 9.5,\n    y: -1.5,\n    distanceFromEarthLightYears: 4.3,\n    schwarzschildDistance: 1.2,"
          );
          fs.writeFileSync(stationsPath, stations);

          const missionPath = 'src/logic/mission.ts';
          let mission = fs.readFileSync(missionPath, 'utf8');
          mission = mission.replace(
            "const realDestinations = route.filter(\n    (station) => station.kind === 'real-destination' && station.distanceFromEarthLightYears\n  );",
            "const realDestinations = route.filter(\n    (station) =>\n      (station.kind === 'real-destination' || station.kind === 'black-hole-zone') &&\n      station.distanceFromEarthLightYears\n  );"
          );
          fs.writeFileSync(missionPath, mission);

          const appPath = 'src/App.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replace('Chi torna piu giovane?', 'Il buco nero e il tempo');
          fs.writeFileSync(appPath, app);

          const htmlPath = 'index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');
          html = html.replace('Chi torna più giovane?', 'Il buco nero e il tempo');
          fs.writeFileSync(htmlPath, html);

          const manifestPath = 'public/manifest.webmanifest';
          let manifest = fs.readFileSync(manifestPath, 'utf8');
          manifest = manifest.replace('Black Hole Time App', 'Il buco nero e il tempo');
          manifest = manifest.replace('Black Hole', 'Buco Nero');
          fs.writeFileSync(manifestPath, manifest);
          NODE
      - run: ./node_modules/.bin/vite build --base=/black-hole-time-app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
